[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-harness"
version = "0.2.0"
description = "A personal software engineering harness: anchored system knowledge with deterministic staleness detection"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

# Dependency budget: two, per ARCHITECTURE.md section 6. tree-sitter powers the
# anchor fingerprints; PyYAML parses claim blocks and schema files. Everything
# else is stdlib or a subprocess call to a tool the project already has.
dependencies = [
    "tree-sitter>=0.23",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Grammars are optional on purpose: without them anchors fall back to
# whitespace-normalised content hashes and are reported coarse. The harness
# works with zero grammars, just less precisely.
grammars = [
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-c-sharp>=0.23",
]
dev = ["pytest>=8"]
docs = [
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.0",
]

[project.scripts]
forge = "forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The skills ship with the kernel. They are the only part of the harness a
# model reads, so a project that installs forge and never runs `forge init`
# still gets them - `forge skill list` falls back to this set. A skill is its
# directory: references and scripts beside a SKILL.md ship with it.
[tool.setuptools.package-data]
forge = ["_skills/**/*"]

[tool.setuptools.exclude-package-data]
forge = ["_skills/**/__pycache__/*"]

# Third-party material inside the skills keeps its notice in every copy.
[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
